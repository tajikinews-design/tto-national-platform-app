apiVersion: apps/v1
kind: Deployment
metadata:
  name: tto-api
  labels:
    app.kubernetes.io/name: tto-api
    app.kubernetes.io/part-of: tto-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tto-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tto-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.invalid/tto/api:REPLACE_WITH_APPROVED_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tto-api-runtime
                  key: database-url
            - name: AUTH_CHALLENGE_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: tto-api-runtime
                  key: challenge-hmac-secret

---
apiVersion: v1
kind: Service
metadata:
  name: tto-api
  labels:
    app.kubernetes.io/part-of: tto-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tto-api
  ports:
    - name: http
      port: 3001
      targetPort: http
