apiVersion: apps/v1
kind: Deployment
metadata:
  name: tto-shareholder
  labels:
    app.kubernetes.io/name: tto-shareholder
    app.kubernetes.io/part-of: tto-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tto-shareholder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tto-shareholder
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shareholder
          image: registry.example.invalid/tto/shareholder:REPLACE_WITH_APPROVED_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          env:
            - name: PORT
              value: "3000"

---
apiVersion: v1
kind: Service
metadata:
  name: tto-shareholder
  labels:
    app.kubernetes.io/part-of: tto-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tto-shareholder
  ports:
    - name: http
      port: 3000
      targetPort: http
