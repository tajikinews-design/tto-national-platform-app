name: PH12 three-portal linked Preview UI build (NO DEPLOY)
on:
  push:
    branches: [feat/ph12-portal-preview-modules-api-navigation-20261108, feat/ph12-approved-dashboards-separated-logins-20261108, feat/nav02-shareholder-intake-draft-20261109]
  pull_request:
    branches: [feat/child06-coop-two-person-attestation-hold-20261108, feat/ph12-portal-preview-modules-api-navigation-20261108]
permissions:
  contents: read
jobs:
  build-preview-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      VERCEL: ""
      NEXT_TELEMETRY_DISABLED: "1"
      TTO_API_BASE_URL: ""
      DATABASE_URL: ""
      APIIR_TOKEN: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Enforce owner-approved TTO-AUTH-UI-V1 freeze (NO UI DRIFT)
        run: |
          set -euo pipefail
          python3 scripts/ci/test_ph12_auth_ui_freeze.py -v
          echo "TTO_AUTH_UI_V1_FROZEN_GREEN"
      - name: Check customer-selected trial domain and complete onboarding source contracts
        run: |
          set -euo pipefail
          python3 scripts/ci/test_ph12_name_first_demo_workspace.py -v
          python3 scripts/ci/test_ph12_cooperative_onboarding_flow.py -v
          python3 scripts/ci/test_ph12_cooperative_settings_subpages.py -v
          python3 scripts/ci/test_ph12_nav02_shareholder_intake.py -v
          python3 scripts/ci/test_ph12_nav02_photo_quarantine.py -v
          python3 scripts/ci/test_ph12_nav02_sensitive_envelopes.py -v
          python3 scripts/ci/test_ph12_members_draft_forms.py -v
          python3 scripts/ci/test_ph12_cooperative_fast_navigation.py -v
          echo "TTO_CUSTOM_VANITY_DOMAIN_CONTRACT_PASS"
      - name: Install workspace and validate all preview portals
        run: |
          set -euo pipefail
          npm install -g pnpm@10.18.0
          pnpm install --frozen-lockfile
          pnpm build
          pnpm check
          echo "TTO_3PORTAL_NAVIGATION_FULL_BUILD_GREEN"
      - name: Ensure all module links target reviewed existing Next route and preserve HOLD
        run: |
          set -euo pipefail
          node scripts/ci/ph12-preview-module-route-map.cjs
          echo "TTO_3PORTAL_PREVIEW_SAFE_ROUTE_CONTRACT_PASS"
          node scripts/ci/ph12-approved-dashboard-roles-contract.cjs
