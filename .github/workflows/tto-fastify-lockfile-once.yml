name: TTO Fastify one-shot lockfile regeneration and Trivy (NO DEPLOY)
on:
  push:
    branches:
      - fix/tto-fastify-security-lock-20261102
    paths:
      - '.github/workflows/tto-fastify-lockfile-once.yml'
permissions:
  contents: write
concurrency:
  group: tto-fastify-rebuild-one-shot
  cancel-in-progress: true
jobs:
  patched-lockfile:
    if: github.ref == 'refs/heads/fix/tto-fastify-security-lock-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
      APIIR_TOKEN: ""
      DATABASE_URL: ""
      TTO_API_BASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
      TTO_FASTIFY_TRIVY_OUTPUT: /tmp/tto-fastify-trivy.json
    steps:
      - name: Isolated checkout with temporary branch-scoped write token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate pnpm lockfile (no dependency installation scripts)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10.18.0 --no-audit --no-fund
          test "$(pnpm --version)" = "10.18.0"
          node -e "const r=require('./package.json'),a=require('./services/api/package.json');if(r.pnpm?.overrides?.fastify!=='5.12.8'||a.dependencies.fastify!=='5.12.8')process.exit(1)"
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --lockfile-only --ignore-scripts --frozen-lockfile
          python3 -m unittest tests/test_fastify_patched_dependency.py -v
          echo "TTO_FASTIFY_PNPM_GENERATED=PASS"
      - name: Scan exact newly generated lockfile with pinned Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.1'
          scan-type: 'fs'
          scan-ref: './pnpm-lock.yaml'
          scanners: 'vuln'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'json'
          output: '/tmp/tto-fastify-trivy.json'
          exit-code: '0'
          cache: 'false'
          hide-progress: 'true'
      - name: Check Fastify CVEs and print privacy-bounded counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,pathlib,sys
          p=pathlib.Path('/tmp/tto-fastify-trivy.json')
          if not p.exists(): sys.exit('TTO_TRIVY_NO_REPORT')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows=[v for r in d.get('Results',[]) for v in (r.get('Vulnerabilities') or [])]
          counts=collections.Counter(v.get('Severity','UNKNOWN') for v in rows)
          fastify=[v for v in rows if v.get('PkgName')=='fastify']
          print('TTO_FASTIFY_TRIVY_EXECUTED=YES')
          print('TTO_FASTIFY_TRIVY_COUNTS='+json.dumps({s:counts.get(s,0) for s in ('CRITICAL','HIGH','MEDIUM')},sort_keys=True))
          print('TTO_FASTIFY_FINDING_COUNT='+str(len(fastify)))
          for v in fastify[:12]: print('TTO_FASTIFY_CVE='+str(v.get('VulnerabilityID','unknown')).replace('\n','')[:60])
          if fastify: sys.exit('TTO_FASTIFY_PATCH_BLOCKED: VULNERABILITY_REMAINS')
          print('TTO_FASTIFY_LOCKFILE_SCOPE_ZERO_MATCHING_CVES=PASS')
          PY
      - name: Commit pnpm-generated lockfile on temporary fix branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/tto-fastify-security-lock-20261102"
          test "$(git diff --name-only)" = "pnpm-lock.yaml"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then echo "TTO_LOCKFILE_NOT_UPDATED"; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(security): regenerate Fastify 5.12.8 lockfile using pnpm 10.18.0"
          git push origin HEAD:refs/heads/fix/tto-fastify-security-lock-20261102
          echo "TTO_FASTIFY_LOCKFILE_COMMITTED=YES"
      - name: Delete private scan JSON from disposable runner
        if: always()
        shell: bash
        run: rm -f "$TTO_FASTIFY_TRIVY_OUTPUT"
