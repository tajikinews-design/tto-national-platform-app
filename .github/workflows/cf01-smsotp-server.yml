name: TTO CF01 API.ir OTP server-side HTTP + PostgreSQL17 (NO SMS / NO DEPLOY)
on:
  push:
    branches: ["feat/vazirmatn-next-preview-otp"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smsotp-server-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tto
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d tto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22"}
      - run: npm install -g pnpm@10.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tto/api build
      - name: No real SMS without independent authorization (no network)
        env:
          APIIR_TOKEN: ""
        run: node services/api/test/sms-delivery-opt-in.test.cjs
      - name: SQL migrations 0001..0005 in ephemeral PG17
        run: |
          for migration in database/migrations/000{1,2,3,4,5}_*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d tto -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: PostgreSQL security negatives for SMSOTP
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/cf01-smsotp-issuance.sql
      - name: Real Nest HTTP + PG17 + fake provider acceptance/verify/replay/limit
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tto
        run: node services/api/test/smsotp-request.integration.cjs
