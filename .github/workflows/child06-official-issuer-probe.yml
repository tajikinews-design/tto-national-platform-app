name: CHILD06 official issuer direct TLS check (AUTHENTICITY HOLD)
on:
  push:
    branches: [feat/child06-three-external-gates-20261108]
  pull_request:
    branches: [feat/child06-pdf-provenance-scan-keyrecovery-hold-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issuer-diagnostic-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Direct authenticated-TLS website reachability diagnostic (NOT notice attestation)
        run: |
          set -euo pipefail
          node --check scripts/ci/child06-official-issuer-probe.cjs
          node scripts/ci/child06-official-issuer-probe.cjs
          echo "CHILD06_OFFICIAL_ISSUER_LEGAL_VALIDITY_HOLD_NO_TRUSTED_API"
