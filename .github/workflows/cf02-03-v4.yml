name: TTO CF02-CF03 actor-bound lifecycle and legal hold v4 (NO DEPLOY)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  pg17-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tto
        options: >-
          --health-cmd "pg_isready -U postgres -d tto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apply all security migrations to disposable PostgreSQL 17
        run: |
          set -euo pipefail
          for s in database/migrations/0001_cf01_cf03_foundation.sql tests/sql/tenant-isolation.sql database/migrations/0002_cf01_03_secure_flows.sql tests/sql/cf01-cf03-v2.sql database/migrations/0003_cf01_03_role_jit_party_document.sql tests/sql/cf01-cf03-v3.sql database/migrations/0004_cf02_privileged_lifecycle_cf03_hold_release.sql tests/sql/cf02-cf03-v4.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d tto -v ON_ERROR_STOP=1 < "$s"
          done
