name: TTO ArvanCloud manifests static review (NO DEPLOY)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse portable YAML (no cloud login)
        run: python3 -m pip install 'PyYAML>=6,<7' && python3 scripts/test_arvan_k8s_templates.py
