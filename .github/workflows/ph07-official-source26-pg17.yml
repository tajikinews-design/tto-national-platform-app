name: PH07 four modules frozen26 synthetic PostgreSQL17 acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - feat/ph06-member-share-ledger-synthetic-gates-20261102
permissions:
  contents: read
concurrency:
  group: ph07-source26-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  official-source26-pg17:
    if: github.head_ref == 'feat/ph07-governance-notice-support-transparency-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      TTO_PRODUCTION_DB_URL: ""
      TTO_PAYMENT_LIVE: "false"
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen 155 and official PH07 26 source-text IDs
        run: |
          set -euo pipefail
          python3 tests/test_ph07_source26_truth.py -v
          python3 tests/test_ph06_source15_truth.py -v
          python3 tests/test_ph05_24_source_truth.py -v
      - name: Start disposable PostgreSQL 17 and isolated database
        run: |
          set -euo pipefail
          docker run -d --rm --name tto-ph07-isolated -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          ready=false
          for n in $(seq 1 100); do
            if docker exec tto-ph07-isolated psql -U postgres -d postgres -Atqc 'SELECT 1' >/dev/null 2>&1; then
              ready=true; break
            fi
            sleep 0.5
          done
          test "$ready" = true || { docker logs tto-ph07-isolated | tail -60; exit 1; }
          made=false
          for n in $(seq 1 40); do
            if docker exec tto-ph07-isolated createdb -U postgres tto >/dev/null 2>&1; then
              made=true; break
            fi
            if docker exec tto-ph07-isolated psql -U postgres -d tto -Atqc 'SELECT 1' >/dev/null 2>&1; then
              made=true; break
            fi
            sleep 1
          done
          test "$made" = true || { docker logs tto-ph07-isolated | tail -60; exit 1; }
      - name: Apply exact-head migrations 0001 through 0024 in disposable PG
        run: |
          set -euo pipefail
          for f in database/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            echo "PH07_SYNTHETIC_MIGRATION=$(basename "$f")"
            docker exec -i tto-ph07-isolated psql -U postgres -d tto -v ON_ERROR_STOP=1 < "$f" >/dev/null
          done
          echo "PH07_SYNTHETIC_MIGRATION_COMPLETE_PASS"
      - name: GOV official 8/8 exact-source assertions
        run: |
          set -euo pipefail
          docker exec -i tto-ph07-isolated psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph07-governance-acceptance.sql
          echo "PH07_GOV_EIGHT_SOURCE_BOUNDARY_PASS"
      - name: COMM official 6/6 exact-source assertions
        run: |
          set -euo pipefail
          docker exec -i tto-ph07-isolated psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph07-communications-acceptance.sql
          echo "PH07_COMM_SIX_SOURCE_BOUNDARY_PASS"
      - name: SUP official 6/6 exact-source assertions
        run: |
          set -euo pipefail
          docker exec -i tto-ph07-isolated psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph07-support-acceptance.sql
          echo "PH07_SUP_SIX_SOURCE_BOUNDARY_PASS"
      - name: TRN official 6/6 exact-source assertions
        run: |
          set -euo pipefail
          docker exec -i tto-ph07-isolated psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph07-transparency-acceptance.sql
          echo "PH07_TRN_SIX_SOURCE_BOUNDARY_PASS"
      - name: Close scoped PH07 synthetic gate, no approval of live workflows
        run: |
          echo "PH07_SOURCE_26_26_SYNTHETIC_PG17_PROOFS_PASS"
          echo "PH07_NO_REAL_ASSEMBLY_E_VOTING_FINANCE_REPORT_OR_MEMBER_NOTICE"
      - name: Erase disposable PostgreSQL even when tests fail
        if: always()
        run: docker rm -f tto-ph07-isolated || true
