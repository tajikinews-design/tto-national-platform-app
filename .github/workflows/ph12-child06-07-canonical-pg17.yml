name: PH12 CHILD06-07 account-ledger source boundary PG17 (NO DEPLOY)
on:
  push:
    branches: [feat/ph12-child06-child07-canonical-failclosed-20261106]
permissions:
  contents: read
concurrency:
  group: ph12-child0607-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-schema-contract-not-legal-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      VERCEL: ""
      DATABASE_URL: ""
      TTO_API_BASE_URL: ""
      TTO_PRODUCTION_DB_URL: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify immutable source indexes and scoped field coverage
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_ph12_physical_parity.py -v
          python3 tests/test_ph12_child06_07_canonical.py
          python3 tests/test_ph12_child06_07_owner_gate.py
          python3 tests/test_ph12_share_market_v3_section51_truth.py
      - name: Prepare actual Next and Nest for 68-migration HTTP integration (NO DEPLOY)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Compile real apps and API, no external service or production secrets
        run: |
          set -euo pipefail
          npm install -g pnpm@10.18.0
          pnpm install --frozen-lockfile
          pnpm build
          pnpm check
          node --test scripts/ci/share-market-v3-preflight.test.cjs
          echo PH12_SHARE_MARKET_V3_PURE_PREFLIGHT_PASS_NOT_LIVE
      - name: Start disposable PostgreSQL17 (no hosted DB)
        run: |
          set -euo pipefail
          docker run -d --rm --name tto-ph12-0607 -p 127.0.0.1:5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=tto postgres:17-alpine
          ok=false
          for attempt in $(seq 1 60); do
            if docker exec tto-ph12-0607 psql -U postgres -d tto -Atqc 'SELECT 1' >/dev/null 2>&1; then ok=true;break;fi
            sleep 1
          done
          test "$ok" = true || { docker logs tto-ph12-0607 | tail -100; exit 1; }
      - name: Replay all current migrations and inspect canonical schema in isolated PG17
        run: |
          set -euo pipefail
          count=0
          for f in database/migrations/[0-9][0-9][0-9][0-9]*.sql; do
            test -f "$f"
            docker exec -i tto-ph12-0607 psql -U postgres -d tto -v ON_ERROR_STOP=1 < "$f" > /dev/null
            count=$((count+1))
          done
          test "$count" -ge 68 || { echo "PH12_NEW_SCHEMA_NOT_INCLUDED";exit 1; }
          echo "PH12_CHILD0607_DISPOSABLE_PG17_68_MIGRATIONS_PASS=$count"
      - name: Prepare disposable market-v3 SQL fixture (NEVER a production migration)
        run: |
          set -euo pipefail
          docker exec -i tto-ph12-0607 psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph12-market-v3-disposable-fixture.sql
          docker exec -i tto-ph12-0607 psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph12-market-v3-source-evidence-extension.sql
          echo PH12_MARKET_V3_DISPOSABLE_SOURCE_POLICY_AND_BOARD_DRAFT_SCHEMA_CREATED
      - name: Run disposable v3 market HTTP API against actual PG17 with tenancy and concurrency proofs
        env:
          CI: "true"
          TTO_MARKET_DISPOSABLE_LAB: "1"
          VERCEL: ""
          TTO_PRODUCTION_DB_URL: ""
          DATABASE_URL: ""
        run: |
          set -euo pipefail
          export TTO_MARKET_LAB_SECRET="$(openssl rand -hex 32)"
          timeout --signal=TERM --kill-after=5s 180s node scripts/ci/e2e-market-v3-disposable.cjs
          echo PH12_MARKET_V3_DISPOSABLE_HTTP_COMPLETE_NOT_LEGAL_ACCEPTANCE
      - name: Source contract positive and denial tests, rollback all synthetic transactions
        run: |
          set -euo pipefail
          docker exec -i tto-ph12-0607 psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph12-child06-child07-canonical-failclosed.sql
          echo "PH12_CHILD0607_SYNTHETIC_SOURCE_BOUNDARY_PASS_NO_TRANSFER"
      - name: Verify all 15 original IDs individually on current 68-migration isolated PG17 (synthetic only)
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/ph12-frozen15-per-id.sql.log"
          docker exec -i tto-ph12-0607 psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph06-member-share-frozen15.sql | tee "$proof"
          python3 - "$proof" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          pairs=re.findall(r"PH06_(MEMBER|SHARE)_AT([0-9]{3})_[A-Z0-9_]*_PASS",raw)
          got={f"{section}-AT-{num}" for section,num in pairs}
          expected={f"MEMBER-AT-{i:03d}" for i in range(1,8)}
          expected|={f"SHARE-AT-{i:03d}" for i in range(1,9)}
          if got!=expected:
              raise SystemExit(f"PH12_FROZEN15_MARKER_MISMATCH missing={sorted(expected-got)} extra={sorted(got-expected)}")
          if "PH06_15_SYNTHETIC_CASES_ROLLED_BACK_NO_REAL_SHARES" not in raw:
              raise SystemExit("PH12_FROZEN15_ROLLBACK_PROOF_MISSING")
          print("PH12_68_MIGRATIONS_15_INDIVIDUAL_SQL_SIGNALS_GREEN_SYNTHETIC_ONLY")
          PY
      - name: Verify original transfer blocker and private schema still intact
        run: |
          set -euo pipefail
          sql="SELECT CASE WHEN
            (SELECT count(*) FROM information_schema.tables WHERE table_schema='tto'
              AND table_name LIKE 'child07_%')=7
            AND NOT has_table_privilege('tto_app','tto.child07_ownership_ledger_entries','INSERT')
            AND (SELECT pg_get_functiondef(p.oid) LIKE '%SELECT false%'
                 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
                 WHERE n.nspname='tto' AND p.proname='ph06_try_finalize_transfer')
            THEN 'PH12_FINALIZE_GUARD_PASS' ELSE 'PH12_GUARD_FAILED' END"
          result="$(docker exec tto-ph12-0607 psql -U postgres -d tto -Atqc "$sql")"
          test "$result" = 'PH12_FINALIZE_GUARD_PASS' || { echo "$result";exit 1; }
      - name: Real three-portal Next-to-Nest HTTP against ALL 68 isolated PG17 migrations
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tto
          TTO_LOOPBACK_E2E: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s node scripts/e2e-cf02-identity-authority.cjs
          echo "PH12_68_MIGRATIONS_THREE_PORTAL_HTTP_PASS_SYNTHETIC_ONLY_NOT_LEGAL_SOURCE_ACCEPTANCE"
      - name: Destroy disposable PG17 container
        if: always()
        run: docker rm -f tto-ph12-0607 || true
