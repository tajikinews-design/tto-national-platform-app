name: TTO adaptive security CI (single runner; NO DEPLOY)
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: "Core validation or complete pre-merge release regression"
        type: choice
        required: true
        default: release
        options: [core, release]
permissions:
  contents: read
concurrency:
  group: tto-adaptive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tto-verified-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APIIR_TOKEN: ""
      # W2 DRAFT LAB ONLY: user requested no Docker. This exact branch is
      # never a release gate; ready_for_review runs the original full checks.
      TTO_W2_NO_DOCKER_BRANCH: ${{ github.event_name == 'pull_request' && (github.event.pull_request.draft && github.head_ref == 'test/w2-inline-pep-offline-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-hardening-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-2-cancellable-pdp-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'spec/w2-3-dormant-boundary-contract-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-4-tamper-evident-audit-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-5-policy-revision-expiry-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-6-signed-pdp-policy-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-7-root-signed-trust-lifecycle-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-8-multi-instance-trust-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-9-durable-trust-recovery-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-10-concurrent-trust-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-11-multiprocess-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-12-crash-recovery-coordinator-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-13-integrated-recovery-no-docker-20261101' || github.event.pull_request.draft && (github.head_ref == 'test/w2-14-owner-fencing-no-docker-20261101' || github.head_ref == 'integration/tto-pcs-004-candidate-no-docker-20261101')) }}
    steps:
      - name: Checkout exact reviewed code without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine fail-closed suite from changed source paths
        id: scope
        shell: bash
        env:
          TTO_PR_BASE: ${{ github.event.pull_request.base.sha }}
          TTO_PR_ACTION: ${{ github.event.action }}
          TTO_PR_DRAFT: ${{ github.event.pull_request.draft }}
          TTO_INPUT_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$TTO_PR_BASE" HEAD > "$RUNNER_TEMP/tto-changed.txt"
          else
            : > "$RUNNER_TEMP/tto-changed.txt"
          fi
          mode="$(python3 scripts/ci/select_suite.py --event "$GITHUB_EVENT_NAME" --action "$TTO_PR_ACTION" --draft "$TTO_PR_DRAFT" --requested "$TTO_INPUT_SUITE" --changes-file "$RUNNER_TEMP/tto-changed.txt")"
          # PCS-005 requires integrated real ephemeral PostgreSQL checks even when the PR contains docs only.
          # This is a branch-scoped stronger quality gate; does not change existing W2 no-Docker branches.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && { [ "$GITHUB_HEAD_REF" = "integration/tto-pcs-005-full-validation-20261101" ] || [ "$GITHUB_HEAD_REF" = "integration/tto-pcs-015-wave0-candidate-20261101" ]; }; then
            mode="release"
          fi
          # NAV-02 handles encrypted PII drafts. While PR #182 stays Draft,
          # require the COMPLETE disposable, no-deploy release regression;
          # never equate this technical suite with legal/production approval.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "feat/nav02-shareholder-intake-draft-20261109" ] || [ "$GITHUB_HEAD_REF" = "feat/nav02-member-intake-legal-form-20261110" ] || [ "$GITHUB_HEAD_REF" = "feat/nav02-member-registration-r2-20261110" ]; then
            mode="release"
          fi
          echo "suite=$mode" >> "$GITHUB_OUTPUT"
          echo "TTO_ADAPTIVE_SUITE=$mode"
      - name: Parse and verify Windows PowerShell local-CI script before execution
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/ci/run-local-docker.ps1"),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw "TTO_WINDOWS_LOCAL_CI_POWERSHELL_PARSE_FAILED"
          }
          Write-Host "TTO_WINDOWS_LOCAL_CI_POWERSHELL_SYNTAX_PASS"
          # Both reviewed scripts must parse cleanly before building applications.
          $additionalTokens = $null
          $additionalErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/ci/local-release-helper.ps1"),
            [ref]$additionalTokens, [ref]$additionalErrors
          ) | Out-Null
          if ($additionalErrors.Count -gt 0) {
            $additionalErrors | ForEach-Object { Write-Error $_.ToString() }
            throw "TTO_WINDOWS_LOCAL_RELEASE_POWERSHELL_PARSE_FAILED"
          }
          Write-Host "TTO_WINDOWS_LOCAL_RELEASE_POWERSHELL_SYNTAX_PASS"
      - name: Source baseline and offline structural tests
        run: |
          set -euo pipefail
          python3 scripts/check_source_baseline.py
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/build_preview.py
      - name: Node 22 for code and release checks
        if: steps.scope.outputs.suite != 'lite'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install once, build all applications once, check TypeScript once
        if: steps.scope.outputs.suite != 'lite'
        run: |
          set -euo pipefail
          npm install -g pnpm@10.18.0
          pnpm install --frozen-lockfile
          pnpm build
          pnpm check
          node --test scripts/ci/nav02-xlsx-roundtrip.test.cjs
      - name: PH03 isolated three-portal Chromium keyboard RTL and contrast acceptance
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ph03-three-portal-secure-shells-20261102'
        env:
          NODE_ENV: "production"
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          APIIR_TOKEN: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tto-ph03-browser --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
          node /tmp/tto-ph03-browser/node_modules/playwright/cli.js install --with-deps chromium
          NODE_PATH=/tmp/tto-ph03-browser/node_modules timeout --signal=TERM --kill-after=5s 240s node scripts/ci/ph03-three-portal-browser.cjs
          echo "TTO_PH03_3PORTAL_BROWSER_A11Y_PASS"
      - name: PCS-005 isolated Chromium shareholder/cooperative mobile and desktop
        if: github.event_name == 'pull_request' && github.head_ref == 'integration/tto-pcs-005-full-validation-20261101'
        env:
          TTO_PCS005_BROWSER: "1"
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          APIIR_TOKEN: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tto-pcs005-browser --no-audit --no-fund playwright@1.56.1
          node /tmp/tto-pcs005-browser/node_modules/playwright/cli.js install --with-deps chromium
          timeout --signal=TERM --kill-after=5s 180s node scripts/ci/pcs005-browser-review.cjs
          echo "TTO_PCS005_PRIVATE_CHROMIUM=PASS"
      - name: PCS-007 synthetic manager-to-shareholder contract (offline broker only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/tto-pcs-007-synthetic-coop-shareholder-20261101'
        env:
          NODE_ENV: "test"
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          APIIR_TOKEN: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 45s node --test scripts/ci/pcs007-synthetic-flow.test.cjs
          echo "TTO_PCS007_SYNTHETIC_NO_REAL_SHARES=PASS"
      - name: PCS-008 two-portal fictional approval real Chromium acceptance
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/tto-pcs-008-browser-vertical-slice-20261101'
        env:
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          APIIR_TOKEN: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tto-pcs008-browser --no-audit --no-fund playwright@1.56.1
          node /tmp/tto-pcs008-browser/node_modules/playwright/cli.js install --with-deps chromium
          timeout --signal=TERM --kill-after=5s 180s node scripts/ci/pcs008-cross-portal-browser.cjs
          echo "TTO_PCS008_TWO_PORTAL_SYNTHETIC_BROWSER_PASS"
      - name: PCS-009 fictional actor isolation and audited admission
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/tto-pcs-009-audited-source-admission-20261101'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s node --test scripts/ci/pcs007-synthetic-flow.test.cjs scripts/ci/pcs009-role-audit.test.cjs
          echo "TTO_PCS009_FAKE_ACTOR_AUDIT_PASS"
      - name: PCS-013 own-only source-gated shareholder UI contract
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/tto-pcs-013-shareholder-own-read-20261101'
        run: |
          set -euo pipefail
          node --test scripts/ci/pcs013-shareholder-guard.test.cjs
          echo "TTO_PCS013_SHAREHOLDER_SOURCE_GUARDS_PASS"
      - name: W2 offline inline policy gate — NO DOCKER, NO DATABASE, NO DEPLOY
        if: env.TTO_W2_NO_DOCKER_BRANCH == 'true'
        env:
          NODE_ENV: "test"
          TTO_LOOPBACK_E2E: "1"
          TTO_W1_BOUNDARY_LAB: "1"
          TTO_W2_OFFLINE_LAB: "1"
          TTO_W22_CANCELLABLE_LAB: "1"
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          TEST_ADMIN_DATABASE_URL: ""
          TTO_DB_POOLER_HOST: ""
          TTO_DB_APP_PASSWORD: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          node --check scripts/security/w2-inline-synthetic-enforcer.cjs
          node --check scripts/ci/w2-inline-lab-http.test.cjs
          node --test scripts/ci/w2-inline-lab-http.test.cjs
          echo "TTO_W2_HARDENING_GITHUB_ACTIONS_NO_DOCKER=PASS"
          echo "TTO_W2_GITHUB_ACTIONS_NO_DOCKER=PASS"
      - name: W2.2 real cancellable PDP process and delayed-response tests — NO DOCKER
        if: github.event_name == 'pull_request' && github.event.pull_request.draft && (github.head_ref == 'test/w2-2-cancellable-pdp-no-docker-20261101' || (github.head_ref == 'spec/w2-3-dormant-boundary-contract-no-docker-20261101' || github.head_ref == 'test/w2-4-tamper-evident-audit-no-docker-20261101' || github.head_ref == 'test/w2-5-policy-revision-expiry-no-docker-20261101' || github.head_ref == 'test/w2-6-signed-pdp-policy-no-docker-20261101' || github.head_ref == 'test/w2-7-root-signed-trust-lifecycle-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-8-multi-instance-trust-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-9-durable-trust-recovery-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-10-concurrent-trust-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-11-multiprocess-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-12-crash-recovery-coordinator-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-13-integrated-recovery-no-docker-20261101' || github.event.pull_request.draft && (github.head_ref == 'test/w2-14-owner-fencing-no-docker-20261101' || github.head_ref == 'integration/tto-pcs-004-candidate-no-docker-20261101')))
        env:
          NODE_ENV: "test"
          TTO_LOOPBACK_E2E: "1"
          TTO_W1_BOUNDARY_LAB: "1"
          TTO_W2_OFFLINE_LAB: "1"
          TTO_W22_CANCELLABLE_LAB: "1"
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          TEST_ADMIN_DATABASE_URL: ""
          TTO_DB_POOLER_HOST: ""
          TTO_DB_APP_PASSWORD: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          node --check scripts/security/w2-2-cancellable-pdp-provider.cjs
          node --check scripts/ci/w2-2-cancellable-pdp-fixture.cjs
          node --check scripts/ci/w2-2-cancellable-pdp.test.cjs
          node --test scripts/ci/w2-2-cancellable-pdp.test.cjs
          echo "TTO_W22_GITHUB_ACTIONS_NO_DOCKER=PASS"
      - name: W2.3 detached BFF Nest security interface contract — NO DOCKER
        if: github.event_name == 'pull_request' && github.event.pull_request.draft && (github.head_ref == 'spec/w2-3-dormant-boundary-contract-no-docker-20261101' || github.head_ref == 'test/w2-4-tamper-evident-audit-no-docker-20261101' || github.head_ref == 'test/w2-5-policy-revision-expiry-no-docker-20261101' || github.head_ref == 'test/w2-6-signed-pdp-policy-no-docker-20261101' || github.head_ref == 'test/w2-7-root-signed-trust-lifecycle-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-8-multi-instance-trust-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-9-durable-trust-recovery-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-10-concurrent-trust-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-11-multiprocess-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-12-crash-recovery-coordinator-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-13-integrated-recovery-no-docker-20261101' || github.event.pull_request.draft && (github.head_ref == 'test/w2-14-owner-fencing-no-docker-20261101' || github.head_ref == 'integration/tto-pcs-004-candidate-no-docker-20261101'))
        env:
          NODE_ENV: "test"
          TTO_LOOPBACK_E2E: "1"
          TTO_W1_BOUNDARY_LAB: "1"
          TTO_W2_OFFLINE_LAB: "1"
          TTO_W22_CANCELLABLE_LAB: "1"
          TTO_W23_CONTRACT_LAB: "1"
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          TEST_ADMIN_DATABASE_URL: ""
          TTO_DB_POOLER_HOST: ""
          TTO_DB_APP_PASSWORD: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          node --check scripts/ci/w23-dormant-boundary-contract.test.cjs
          node --test scripts/ci/w23-dormant-boundary-contract.test.cjs
          echo "TTO_W23_GITHUB_ACTIONS_NO_DOCKER=PASS"
      - name: W2.4 file-backed synthetic audit integrity — NO DOCKER
        if: github.event_name == 'pull_request' && github.event.pull_request.draft && (github.head_ref == 'test/w2-4-tamper-evident-audit-no-docker-20261101' || github.head_ref == 'test/w2-5-policy-revision-expiry-no-docker-20261101' || github.head_ref == 'test/w2-6-signed-pdp-policy-no-docker-20261101' || github.head_ref == 'test/w2-7-root-signed-trust-lifecycle-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-8-multi-instance-trust-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-9-durable-trust-recovery-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-10-concurrent-trust-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-11-multiprocess-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-12-crash-recovery-coordinator-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-13-integrated-recovery-no-docker-20261101' || github.event.pull_request.draft && (github.head_ref == 'test/w2-14-owner-fencing-no-docker-20261101' || github.head_ref == 'integration/tto-pcs-004-candidate-no-docker-20261101'))
        env:
          NODE_ENV: "test"
          TTO_LOOPBACK_E2E: "1"
          TTO_W1_BOUNDARY_LAB: "1"
          TTO_W2_OFFLINE_LAB: "1"
          TTO_W22_CANCELLABLE_LAB: "1"
          TTO_W23_CONTRACT_LAB: "1"
          TTO_W24_AUDIT_LAB: "1"
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          TEST_ADMIN_DATABASE_URL: ""
          TTO_DB_POOLER_HOST: ""
          TTO_DB_APP_PASSWORD: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          node --check scripts/security/w24-offline-audit-ledger.cjs
          node --check scripts/ci/w24-offline-audit-chain.test.cjs
          node --test scripts/ci/w24-offline-audit-chain.test.cjs
          echo "TTO_W24_GITHUB_ACTIONS_NO_DOCKER=PASS"
      - name: W2.5 monotonic policy revisions, expiry and stale PDP decisions — NO DOCKER
        if: github.event_name == 'pull_request' && github.event.pull_request.draft && (github.head_ref == 'test/w2-5-policy-revision-expiry-no-docker-20261101' || github.head_ref == 'test/w2-6-signed-pdp-policy-no-docker-20261101' || github.head_ref == 'test/w2-7-root-signed-trust-lifecycle-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-8-multi-instance-trust-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-9-durable-trust-recovery-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-10-concurrent-trust-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-11-multiprocess-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-12-crash-recovery-coordinator-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-13-integrated-recovery-no-docker-20261101' || github.event.pull_request.draft && (github.head_ref == 'test/w2-14-owner-fencing-no-docker-20261101' || github.head_ref == 'integration/tto-pcs-004-candidate-no-docker-20261101'))
        env:
          NODE_ENV: "test"
          TTO_LOOPBACK_E2E: "1"
          TTO_W1_BOUNDARY_LAB: "1"
          TTO_W2_OFFLINE_LAB: "1"
          TTO_W22_CANCELLABLE_LAB: "1"
          TTO_W23_CONTRACT_LAB: "1"
          TTO_W24_AUDIT_LAB: "1"
          TTO_W25_POLICY_LAB: "1"
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          TEST_ADMIN_DATABASE_URL: ""
          TTO_DB_POOLER_HOST: ""
          TTO_DB_APP_PASSWORD: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          node --check scripts/security/w25-synthetic-policy-registry.cjs
          node --check scripts/security/w25-synthetic-policy-version-enforcer.cjs
          node --check scripts/ci/w25-policy-revision-expiry.test.cjs
          node --test scripts/ci/w25-policy-revision-expiry.test.cjs
          echo "TTO_W25_GITHUB_ACTIONS_NO_DOCKER=PASS"
      - name: W2.6 child-authored Ed25519 PDP and signed policy proof — NO DOCKER
        if: github.event_name == 'pull_request' && github.event.pull_request.draft && (github.head_ref == 'test/w2-6-signed-pdp-policy-no-docker-20261101' || github.head_ref == 'test/w2-7-root-signed-trust-lifecycle-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-8-multi-instance-trust-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-9-durable-trust-recovery-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-10-concurrent-trust-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-11-multiprocess-fencing-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-12-crash-recovery-coordinator-no-docker-20261101' || github.event.pull_request.draft && github.head_ref == 'test/w2-13-integrated-recovery-no-docker-20261101' || github.event.pull_request.draft && (github.head_ref == 'test/w2-14-owner-fencing-no-docker-20261101' || github.head_ref == 'integration/tto-pcs-004-candidate-no-docker-20261101'))
        env:
          NODE_ENV: "test"
          CI: "true"
          TTO_LOOPBACK_E2E: "1"
          TTO_W1_BOUNDARY_LAB: "1"
          TTO_W2_OFFLINE_LAB: "1"
          TTO_W22_CANCELLABLE_LAB: "1"
          TTO_W23_CONTRACT_LAB: "1"
          TTO_W24_AUDIT_LAB: "1"
          TTO_W25_POLICY_LAB: "1"
          TTO_W26_SIGNED_LAB: "1"
          DATABASE_URL: ""
          TTO_API_BASE_URL: ""
          APIIR_TOKEN: ""
          TEST_ADMIN_DATABASE_URL: ""
          TTO_DB_POOLER_HOST: ""
          TTO_DB_APP_PASSWORD: ""
          VERCEL: ""
        run: |
          set -euo pipefail
          node --check scripts/security/w26-signed-policy-protocol.cjs
          node --check scripts/security/w26-independent-pdp-child.cjs
          node --check scripts/security/w26-signed-pdp-gateway.cjs
          node --check scripts/security/w26-signed-pdp-enforcer.cjs
          node --check scripts/ci/w26-signed-pdp-policy.test.cjs
          timeout --signal=TERM --kill-after=5s 90s node --test scripts/ci/w26-signed-pdp-policy.test.cjs
