name: PH10 cooperative dossier isolated verification
on:
  push:
    branches: [feat/ph10-cooperative-dossier-lifecycle-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-dossier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      VERCEL: ""
      APIIR_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22"}
      - name: Validate Nest and Next compile without deployment
        run: |
          set -euo pipefail
          npm install -g pnpm@10.18.0
          pnpm install --frozen-lockfile
          pnpm --filter @tto/api typecheck
          pnpm --filter @tto/national-admin typecheck
      - name: Start ephemeral PostgreSQL17 without hosted credentials
        run: |
          set -euo pipefail
          docker run -d --rm --name tto-ph10-dossier -p 127.0.0.1:5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=tto postgres:17-alpine
          ok=false
          for i in $(seq 1 90); do
            if docker exec tto-ph10-dossier psql -U postgres -d tto -Atqc 'SELECT 1' >/dev/null 2>&1; then ok=true;break;fi
            sleep 0.5
          done
          test "$ok" = true
      - name: Apply exact-branch migrations exclusively inside ephemeral PG17
        run: |
          set -euo pipefail
          for f in database/migrations/[0-9][0-9][0-9][0-9]*.sql; do
            echo "PH10_DISPOSABLE_MIGRATION=$(basename "$f")"
            docker exec -i tto-ph10-dossier psql -U postgres -d tto -v ON_ERROR_STOP=1 < "$f" >/dev/null
          done
          echo PH10_DOSSIER_DISPOSABLE_MIGRATIONS_PASS
      - name: Execute isolated review and anti-replay assertions
        run: |
          set -euo pipefail
          for test_file in \
            tests/sql/ph10-cooperative-dossier-review-disposable.sql \
            tests/sql/ph10-cooperative-draft-disposable.sql \
            tests/sql/ph10-cooperative-evidence-quarantine-disposable.sql; do
            echo "PH10_DISPOSABLE_CASE=$test_file"
            docker exec -i tto-ph10-dossier psql -U postgres -d tto -v ON_ERROR_STOP=1 < "$test_file"
          done
          echo PH10_DOSSIER_REVIEW_DB_GATE_PASS_NO_LEGAL_APPROVAL
      - name: Build real Nest API and Next national panel (disposable only)
        run: |
          set -euo pipefail
          pnpm --filter @tto/api build
          pnpm --filter @tto/national-admin build
      - name: Install pinned Chromium for authenticated synthetic onboarding browser
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tto-ph10-onboarding-browser --no-audit --no-fund playwright@1.56.1
          node /tmp/tto-ph10-onboarding-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Execute authenticated national BFF to Nest to PG17 end-to-end workflow
        env:
          TTO_ISOLATED_DEMO_DB: "true"
          TEST_ADMIN_DATABASE_URL: "postgresql://postgres@127.0.0.1:5432/tto"
          TTO_COOP_QUARANTINE_KEY_HEX: "${{ hashFiles('database/migrations/9999b_ph10_cooperative_evidence_quarantine.sql') }}"
          NODE_PATH: /tmp/tto-ph10-onboarding-browser/node_modules
          PH10_COOP_CHROMIUM: "1"
        run: |
          set -euo pipefail
          test "${#TTO_COOP_QUARANTINE_KEY_HEX}" -eq 64
          timeout --signal=TERM --kill-after=5s 300s node scripts/ci/ph10-cooperative-onboarding-http-e2e.cjs
          echo PH10_COOP_FULL_BFF_NEST_POSTGRES17_E2E_GATE_PASS_NO_LEGAL_APPROVAL
      - name: Upload synthetic onboarding browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ph10-cooperative-onboarding-chromium-synthetic
          path: ph10-artifacts/onboarding-*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Destroy database even on failure
        if: always()
        run: docker rm -f tto-ph10-dossier || true
