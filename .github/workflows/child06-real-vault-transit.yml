name: CHILD06 real Vault Transit key custody lab (NO DEPLOY)
on:
  push:
    branches: [feat/child06-three-external-gates-20261108]
  pull_request:
    branches: [feat/child06-pdf-provenance-scan-keyrecovery-hold-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vault-transit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: "true"
      TTO_CHILD06_VAULT_LAB: "true"
      TTO_CHILD06_VAULT_ADDR: http://127.0.0.1:8200
      TTO_CHILD06_VAULT_TOKEN: child06-synthetic-lab-token
      VERCEL: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Live ephemeral Vault Transit backend (no real keys)
        run: |
          set -euo pipefail
          docker run -d --rm --name tto-child06-transit -p 127.0.0.1:8200:8200 \
           --cap-add IPC_LOCK \
           -e VAULT_DEV_ROOT_TOKEN_ID="$TTO_CHILD06_VAULT_TOKEN" \
           -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
           hashicorp/vault:1.18 server -dev
          for i in $(seq 1 100); do
            if docker exec -e VAULT_ADDR=http://127.0.0.1:8200 \
              -e VAULT_TOKEN="$TTO_CHILD06_VAULT_TOKEN" \
              tto-child06-transit vault status >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN="$TTO_CHILD06_VAULT_TOKEN" \
            tto-child06-transit vault secrets enable transit
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN="$TTO_CHILD06_VAULT_TOKEN" \
            tto-child06-transit vault write -f transit/keys/child06-pdf
      - name: Compile API and test genuine Vault Transit encryption
        run: |
          set -euo pipefail
          npm install -g pnpm@10.18.0
          pnpm install --frozen-lockfile
          pnpm --dir services/api build
          node scripts/ci/child06-real-vault-transit.test.cjs
          echo "CHILD06_VAULT_KMS_REAL_TRANSIT_LAB_ONLY_NOT_DURABLE_PRODUCTION"
      - name: Remove disposable Vault runtime
        if: always()
        run: docker rm -f tto-child06-transit || true
