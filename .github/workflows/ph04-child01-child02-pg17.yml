name: PH04 Child01/02 physical contract and RLS acceptance (synthetic PG17 only)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - feat/ph03-three-portal-secure-shells-20261102
permissions:
  contents: read
concurrency:
  group: ph04-contract-pg17-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  child01-child02-disposable-pg:
    if: github.head_ref == 'feat/ph04-identity-tenant-party-contract-parity-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
      DATABASE_URL: ""
      TTO_API_BASE_URL: ""
      APIIR_TOKEN: ""
      VERCEL: ""
    steps:
      - name: Checkout exact PR commit read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Start synthetic non-hosted PG17
        run: |
          set -euo pipefail
          docker run --rm -d --name tto-ph04-ci-pg -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for n in $(seq 1 100); do
            if docker exec tto-ph04-ci-pg pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 0.4
          done
          docker exec tto-ph04-ci-pg pg_isready -U postgres
          docker exec tto-ph04-ci-pg createdb -U postgres tto
      - name: Apply pinned additive migrations 0001..0012 on disposable PG only
        run: |
          set -euo pipefail
          for f in database/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            echo "PH04_MIGRATION_APPLY_SYNTHETIC=$(basename "$f")"
            docker exec -i tto-ph04-ci-pg psql -U postgres -d tto -v ON_ERROR_STOP=1 < "$f" >/dev/null
          done
          echo "TTO_PH04_ALL_MIGRATIONS_SYNTHETIC_PASS"
      - name: Verify source physical field constraints and fail-closed isolation
        run: |
          set -euo pipefail
          docker exec -i tto-ph04-ci-pg psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph04-identity-tenant-party-v12.sql
          echo "TTO_PH04_CF01_CF02_SYNTHETIC_SQL_ACCEPTANCE_PASS"
      - name: Execute original CHILD-02 eight scenarios with partial-evidence flags
        run: |
          set -euo pipefail
          docker exec -i tto-ph04-ci-pg psql -U postgres -d tto -v ON_ERROR_STOP=1 < tests/sql/ph04-child02-source-eight.sql
          echo "TTO_PH04_CHILD02_SOURCE_EIGHT_PROBES_PASS_WITH_PARTIAL_GAPS"
      - name: Stop synthetic PG17 and erase data
        if: always()
        run: docker rm -f tto-ph04-ci-pg || true
