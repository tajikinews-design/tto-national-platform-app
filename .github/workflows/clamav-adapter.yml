name: TTO CF03 ClamAV INSTREAM adapter protocol tests (NO DEPLOY)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  scanner-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Protocol-level synthetic scanner tests
        run: node --test services/workers/test/clamav.test.cjs
