name: TTO CF02 identity legal gate + managerial and national scopes (NO DEPLOY)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cf02-identity-manager-national-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tto
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d tto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APIIR_TOKEN: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22"}
      - run: npm install -g pnpm@10.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm check
      - name: Disposable PostgreSQL17 schema through 0009, no hosted database
        run: |
          for migration in database/migrations/000{1,2,3,4,5,6,7,8,9}_*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d tto -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Real HTTP positive and negative identity, manager, national and Child06/07 owner-only source E2E
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tto
        run: node scripts/e2e-cf02-identity-authority.cjs
